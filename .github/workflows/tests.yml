name: shared tests

# Site-agnostic infrastructure checks. Each clone's advisory
# diagnostics live in its own tests-<site>.yml dispatcher, so no site list
# belongs in this file.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: shared-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: ruff check src tests websitebench
      - run: python -m pytest tests/project tests/offline_clone/test_manifest_and_cli.py tests/offline_clone/test_diagnostics.py -q

  harbor-v2-deterministic:
    name: Harbor v2 deterministic verifier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      WEBSITEBENCH_REQUIRE_REAL_V2_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace
      - run: python -m playwright install --with-deps chromium
      - name: Run every Harbor test with formal root isolation enabled
        run: >-
          sudo --preserve-env=PLAYWRIGHT_BROWSERS_PATH,WEBSITEBENCH_REQUIRE_REAL_V2_E2E
          "$(command -v python)" -m pytest tests/harbor -q -rs
