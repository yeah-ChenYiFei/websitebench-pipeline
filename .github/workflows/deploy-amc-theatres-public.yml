name: Deploy AMC Theatres public demo

on:
  push:
    branches: [web2code2web]
    paths: [".github/workflows/deploy-amc-theatres-public.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the anonymous public demo"
        required: true
        type: boolean
        default: false

concurrency:
  group: public-demo-amc-theatres
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/public-demo-site.yml
    with:
      site: amc-theatres
      package: deploy/generic-offline-clone
      wrangler_config: deploy/generic-offline-clone/wrangler.generated.jsonc
      prepare_command: node deploy/generic-offline-clone/scripts/prepare.mjs --config deploy/generic-offline-clone/deployment.amc-theatres.v2.json
      deploy_command: npx --prefix deploy/generic-offline-clone wrangler deploy --config deploy/generic-offline-clone/wrangler.generated.jsonc --containers-rollout=immediate
      url: https://amc-theatres.website-bench.com
      deploy: ${{ inputs.deploy }}
    secrets: inherit
