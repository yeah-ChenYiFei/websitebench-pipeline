name: diagnostics (crumbl-cookies)
on:
  pull_request:
    paths:
      - materials/crumbl-cookies/**
      - .github/workflows/tests-crumbl-cookies.yml
      - .github/workflows/clone-diagnostics.yml
  push:
    paths:
      - materials/crumbl-cookies/**
      - .github/workflows/tests-crumbl-cookies.yml
      - .github/workflows/clone-diagnostics.yml
permissions:
  contents: read
concurrency:
  group: diagnostics-crumbl-cookies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostics:
    uses: ./.github/workflows/clone-diagnostics.yml
    with:
      site: crumbl-cookies
