name: diagnostics (blinkist)

on:
  pull_request:
    paths:
      - materials/blinkist/**
      - src/websitebench/offline_clone/diagnostics.py
      - tests/offline_clone/test_diagnostics.py
      - .github/workflows/tests-blinkist.yml
      - .github/workflows/clone-diagnostics.yml
  push:
    paths:
      - materials/blinkist/**
      - src/websitebench/offline_clone/diagnostics.py
      - tests/offline_clone/test_diagnostics.py
      - .github/workflows/tests-blinkist.yml
      - .github/workflows/clone-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: diagnostics-blinkist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the current revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the current checkout
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Install the trusted browser runtime
        run: python -m playwright install --with-deps chromium
      - name: Run Blinkist diagnostics without a quality gate
        shell: bash
        run: |
          set +e
          report="${RUNNER_TEMP}/diagnostic-blinkist.json"
          python -m websitebench.offline_clone.cli verify \
            --site "${GITHUB_WORKSPACE}/materials/blinkist" --out "${report}"
          diagnostic_exit=$?
          set -e
          if [[ -f "${report}" ]]; then
            status="$(jq -r '.diagnostic_status // "incomplete"' "${report}")"
            echo "::notice title=clone-diagnostics=blinkist::${status}; maintainer judgment required; exit ${diagnostic_exit}"
          else
            printf '%s\n' '{"schema_version":"offline-clone.diagnostic-report.v1","authority":"diagnostic-only","qualification":"maintainer-judgment-required","diagnostic_status":"incomplete","site_id":"blinkist","generated_at":"1970-01-01T00:00:00Z"}' > "${report}"
            echo "::warning title=clone-diagnostics=blinkist::verifier emitted no report; maintainer judgment required"
          fi
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-clone-diagnostic-blinkist
          path: ${{ runner.temp }}/diagnostic-blinkist.json
          if-no-files-found: error
          retention-days: 14
