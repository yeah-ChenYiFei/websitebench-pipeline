name: diagnostics (betterhelp)

on:
  pull_request:
    paths:
      - materials/betterhelp/**
      - harbor/sites/betterhelp/**
      - harbor/instances/betterhelp/**
      - .github/workflows/tests-betterhelp.yml
      - .github/workflows/clone-diagnostics.yml
  push:
    paths:
      - materials/betterhelp/**
      - harbor/sites/betterhelp/**
      - harbor/instances/betterhelp/**
      - .github/workflows/tests-betterhelp.yml
      - .github/workflows/clone-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: diagnostics-betterhelp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    uses: ./.github/workflows/clone-diagnostics.yml
    with:
      site: betterhelp
