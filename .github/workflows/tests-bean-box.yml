name: diagnostics (bean-box)

on:
  pull_request:
    paths:
      - materials/bean-box/**
      - harbor/sites/bean-box/**
      - harbor/instances/bean-box/**
      - .github/workflows/tests-bean-box.yml
      - .github/workflows/clone-diagnostics.yml
  push:
    paths:
      - materials/bean-box/**
      - harbor/sites/bean-box/**
      - harbor/instances/bean-box/**
      - .github/workflows/tests-bean-box.yml
      - .github/workflows/clone-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: diagnostics-bean-box-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    uses: ./.github/workflows/clone-diagnostics.yml
    with:
      site: bean-box
