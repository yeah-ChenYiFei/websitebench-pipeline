name: diagnostics (styleseat)

on:
  pull_request:
    paths:
      - materials/styleseat/**
      - .github/workflows/tests-styleseat.yml
      - .github/workflows/clone-diagnostics.yml
  push:
    paths:
      - materials/styleseat/**
      - .github/workflows/tests-styleseat.yml
      - .github/workflows/clone-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: diagnostics-styleseat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    uses: ./.github/workflows/clone-diagnostics.yml
    with:
      site: styleseat
