name: diagnostics (33)
on:
  pull_request:
    paths:
      - materials/33/**
      - .github/workflows/tests-33.yml
      - .github/workflows/clone-diagnostics.yml
  push:
    paths:
      - materials/33/**
      - .github/workflows/tests-33.yml
      - .github/workflows/clone-diagnostics.yml
permissions:
  contents: read
concurrency:
  group: diagnostics-33-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostics:
    uses: ./.github/workflows/clone-diagnostics.yml
    with:
      site: 33
