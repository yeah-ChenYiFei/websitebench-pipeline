          - paragraph [ref=f1e52]: BetterHelp was founded in 2013 to remove the traditional barriers to therapy and make mental health care more accessible to everyone. Today, it is the world’s largest therapy service — providing professional, affordable, and tailored therapy in a convenient online format. BetterHelp’s network of more than 31,000 licensed therapists has helped over 5 million people worldwide take ownership of their mental health and work towards their personal goals. As the unmet need for mental health services continues to grow, BetterHelp is committed to expanding access to therapy globally.
