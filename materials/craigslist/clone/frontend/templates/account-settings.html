{% extends "base.html" %}
{% block title %}account settings - craigslist{% endblock %}
{% block content %}
<h1 class="cl-page-heading">account settings</h1>
<nav class="account-nav">
  <a href="/account/home">your postings</a>
  <a href="/account/saved">favorites</a>
  <a href="/account/searches">saved searches</a>
  <a href="/account/settings" class="active">settings</a>
</nav>
<form class="cl-form" method="post" action="/account/settings">
  <label for="email">email address</label>
  <input type="email" id="email" value="{{ email }}" disabled>
  <p class="filter-label">Email cannot be changed in this offline clone.</p>
  <div class="checkbox-row">
    <input type="checkbox" id="notify" checked disabled>
    <label for="notify" style="margin:0;">email me about my postings</label>
  </div>
  <div class="form-actions">
    <button type="submit" disabled>save settings</button>
  </div>
</form>
<form class="cl-form" method="post" action="/account/logout" style="margin-top:20px;">
  <button type="submit">log out</button>
</form>
{% endblock %}
