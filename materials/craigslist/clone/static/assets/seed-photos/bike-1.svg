<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="vintage road bike">
  <title>vintage road bike</title>

  <rect x="0" y="0" width="640" height="480" fill="#eef2ee"/>
  <circle cx="220" cy="300" r="90" fill="none" stroke="#3c3c3c" stroke-width="12"/>
  <circle cx="460" cy="300" r="90" fill="none" stroke="#3c3c3c" stroke-width="12"/>
  <line x1="220" y1="300" x2="340" y2="220" stroke="#8a5f3c" stroke-width="10"/>
  <line x1="340" y1="220" x2="460" y2="300" stroke="#8a5f3c" stroke-width="10"/>
  <line x1="340" y1="220" x2="300" y2="360" stroke="#8a5f3c" stroke-width="10"/>
  <line x1="460" y1="300" x2="300" y2="360" stroke="#3c3c3c" stroke-width="8"/>
  <rect x="330" y="180" width="24" height="40" fill="#3c3c3c" rx="4"/>

  <text x="16" y="470" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666">vintage road bike</text>
