schema_version: offline-clone.manifest.v2
site_id: bean-box
display_name: Bean Box
state_model: stateful
source:
  origins:
  - https://beanbox.com
  baseline:
    locale: en-US
    currency: USD
    delivery_region: US-synthetic-only
    timezone: Etc/UTC
    auth_state: anonymous
    tenant: null
    workspace: null
    role: anonymous-shopper
    capabilities:
    - public-catalogue
    - local-subscription-configurator
    - local-sandbox-checkout
    - synthetic-local-account
    - local-subscription-management
    feature_flags:
    - source-checkout-unavailable
    - source-6-cup-conflict
    - local-trace-six-cup-compatibility
    - local-only-auth-expanded-task
    user_agent: null
    viewport:
      width: 1440
      height: 900
    capture_id: bean-box.2026-08-20.r1
  capture_policy:
    safe_methods:
    - GET
    - HEAD
    runtime_remote_requests: forbidden
scope:
  purpose: scope/purpose.json
  invariants: scope/invariants.json
  routes: scope/routes.json
  journeys: scope/journeys.json
  checkpoints: scope/checkpoints.json
  claims: scope/claims.jsonl
  coverage: scope/coverage.json
paths:
  candidate_root: clone
  candidate_excludes: []
  asset_manifest: source-assets/manifest.json
  backend_model: backend/model.json
  artifact_root: artifacts/offline-clone
